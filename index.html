<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #error { color: #b42318; }
    #draft { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>

  <p id="status" aria-live="polite"></p>
  <p id="error" role="alert"></p>
  <section id="answer" hidden>
    <p><strong>Тема:</strong> <span id="topic"></span></p>
    <p><strong>Черновик:</strong></p>
    <div id="draft"></div>
  </section>

  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const status = document.querySelector("#status");
    const error = document.querySelector("#error");
    const answer = document.querySelector("#answer");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");

    function clearAnswer() {
      answer.hidden = true;
      topic.textContent = "";
      draft.textContent = "";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.textContent = "";
      status.textContent = "Обрабатываем заявку…";

      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
        });
        const data = await reply.json();

        if (data.status === "ready") {
          status.textContent = "Готово";
          topic.textContent = data.topic;
          draft.textContent = data.draft;
          answer.hidden = false;
          return;
        }

        clearAnswer();
        status.textContent = "";

        if (data.status === "manual_review") {
          error.textContent = "AI не смог корректно разобрать заявку. Выполните ручной разбор.";
        } else if (data.status === "invalid_input") {
          error.textContent = "Введите текст заявки.";
        } else {
          error.textContent = "Не удалось обработать заявку. Попробуйте ещё раз.";
        }
      } catch {
        clearAnswer();
        status.textContent = "";
        error.textContent = "Не удалось связаться с сервисом. Выполните ручной разбор.";
      }
    });
  </script>
</body>
</html>
